name: Release

# Push a tag like v0.2.0 to build a signed sideload package and attach it to a draft release.
# Set the same version in Silolux/Package.appxmanifest (Identity Version, e.g. 0.2.0.0) first.
#
# Signing: if the repository secrets XBOX_SIGNING_PFX (the .pfx, base64) and
# XBOX_SIGNING_PASSWORD are set, the package is signed with that certificate, so every
# release shares one publisher certificate. Without them a one-off self-signed certificate
# is made for the run. Its subject must match the manifest Publisher (CN=FrontierWingGaming).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.XBOX_SIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.XBOX_SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          if ($env:PFX_BASE64) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            $password = $env:PFX_PASSWORD
            Write-Host "Signing with the repository certificate."
          } else {
            $password = [guid]::NewGuid().ToString()
            $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=FrontierWingGaming" `
              -KeyUsage DigitalSignature -FriendlyName "Silolux release signing" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") `
              -NotAfter (Get-Date).AddYears(1)
            Export-PfxCertificate -Cert $cert -FilePath $pfx `
              -Password (ConvertTo-SecureString $password -Force -AsPlainText) | Out-Null
            Write-Host "No XBOX_SIGNING_PFX secret: signed with a one-off self-signed certificate."
          }
          "::add-mask::$password"
          "PFX_PATH=$pfx" >> $env:GITHUB_ENV
          "PFX_PASS=$password" >> $env:GITHUB_ENV

      - name: Build package
        run: >
          msbuild Silolux\Silolux.csproj /restore /m
          /p:Configuration=Release /p:Platform=x64
          /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Never
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile=${{ env.PFX_PATH }}
          /p:PackageCertificatePassword=${{ env.PFX_PASS }}
          /p:AppxPackageDir=${{ runner.temp }}\out\

      # One zip per release: the .msix, its .cer, the runtime packages it depends on,
      # and Microsoft's install scripts for a PC.
      - name: Zip
        shell: pwsh
        run: |
          $dir = Get-ChildItem "$env:RUNNER_TEMP\out" -Directory | Select-Object -First 1
          Remove-Item -Recurse -Force (Join-Path $dir.FullName "TelemetryDependencies") -ErrorAction SilentlyContinue
          Get-ChildItem $dir.FullName -Filter *.appxsym | Remove-Item
          $name = $dir.Name -replace '_Test$', ''
          Compress-Archive -Path (Join-Path $dir.FullName "*") -DestinationPath "$env:RUNNER_TEMP\$name.zip"
          "ZIP=$env:RUNNER_TEMP\$name.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: silolux-xbox-package
          path: ${{ env.ZIP }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ env.ZIP }}
